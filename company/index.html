<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company | ArsUltra // Deep Space Heritage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap');
    :root { --space-black: #020617; }
    body { background-color: var(--space-black); font-family: 'Inter', sans-serif; color: #f1f5f9; overflow-x: hidden; }
    .mono { font-family: 'Roboto Mono', monospace; }
    .bg-grid { background-size: 60px 60px; background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); }
    .glass-card { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .text-outline { -webkit-text-stroke: 1px rgba(255,255,255,0.1); color: transparent; }
  </style>
</head>
<body class="bg-grid">
<nav id="global-nav"></nav>

<main class="pt-40 pb-20 px-6">
  <div class="max-w-6xl mx-auto">
    <!-- Corporate Core -->
    <section id="business-section" class="mb-40"></section>
    
    <!-- Identity Section -->
    <section id="identity-section" class="mb-40"></section>

    <!-- Interactive Philosophy -->
    <section class="relative">
        <div class="absolute -top-20 left-0 text-9xl font-black text-outline uppercase select-none pointer-events-none italic manifesto-tag">Manifesto</div>
        
        <div class="flex flex-col md:flex-row gap-12 items-baseline mb-20 relative z-10">
            <h2 class="text-6xl font-black text-white uppercase tracking-tighter italic philosophy-title">Philosophy</h2>
            <p class="text-orange-500 mono text-xs tracking-[0.4em] uppercase font-bold italic hr-text">Humanos con Recursos</p>
        </div>

        <div id="manifesto-grid" class="space-y-32">
            <!-- Injected by company-logic.ts -->
        </div>
    </section>
  </div>
</main>

<footer id="global-footer"></footer>

<script type="module" src="/src/pages/company-logic.ts"></script>
</body>
</html>
