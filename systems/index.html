<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Systems | ArsUltra // Technical Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap');
    :root { --space-black: #020617; }
    body { background-color: var(--space-black); font-family: 'Inter', sans-serif; color: #f1f5f9; overflow-x: hidden; }
    .mono { font-family: 'Roboto Mono', monospace; }
    .bg-grid { background-size: 60px 60px; background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); }
    .glass-card { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .text-outline { -webkit-text-stroke: 1px rgba(255,255,255,0.1); color: transparent; }
  </style>
</head>
<body class="bg-grid">
<nav id="global-nav"></nav>

<main class="pt-40 pb-20 px-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-col md:flex-row items-baseline justify-between mb-24 border-b border-white/5 pb-12 gap-6">
      <div>
        <h1 class="text-6xl font-black uppercase tracking-tighter italic systems-title">Technical Catalog</h1>
        <p class="mono text-[10px] text-orange-500 uppercase tracking-[0.4em] mt-4 font-bold italic systems-tagline">Rad-Hard & High-Reliability Systems</p>
      </div>
      <div class="text-right">
        <span class="mono text-[10px] text-slate-500 uppercase tracking-widest block mb-2 opacity-60 last-sync">Last Sync: March 2026</span>
        <span class="mono text-[10px] text-slate-300 uppercase tracking-widest block font-bold ready-text">V.3.0 Ready for GEO/LEO</span>
      </div>
    </div>

    <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Injected by systems-logic.ts -->
    </div>
  </div>
</main>

<footer id="global-footer"></footer>

<script type="module" src="/src/pages/systems-logic.ts"></script>
</body>
</html>
